<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03203D">
<title>Offline · Silo</title>
<style>
	:root { color-scheme: dark; }
	body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
		font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #EAF2F9;
		background: radial-gradient(120% 70% at 50% 0%, #0D3A66 0%, #03203D 60%) fixed, #03203D; }
	main { max-width: 380px; }
	img { width: 84px; height: 84px; border-radius: 24px; }
	h1 { font-size: 26px; margin: 18px 0 6px; }
	p { color: #9DB4CA; margin: 0 0 22px; }
	button { width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: #639CC5; color: #03203D; font: 600 16px system-ui, sans-serif; }
</style>
</head>
<body>
<main>
	<img src="/icons/icon-192.png" alt="">
	<h1>You’re offline</h1>
	<p>Silo needs a connection to send and receive messages. Your chats will be here when you’re back.</p>
	<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
