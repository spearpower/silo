<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4A30">
<title>Offline · PicknPlay</title>
<style>
	:root{color-scheme:dark}
	body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
		font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#F6F3EA;
		background:radial-gradient(120% 70% at 50% 0%,#0F5638 0%,#0A3F29 60%) fixed,#0A3F29;text-align:center}
	main{max-width:420px}
	img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
	h1{font:800 32px/1.1 ui-rounded,-apple-system,sans-serif;margin:16px 0 8px}
	p{color:rgba(246,243,234,.72);margin:0 0 24px}
	button{width:100%;min-height:52px;border:0;border-radius:16px;background:#F2C14E;color:#1A1405;font:600 17px -apple-system,sans-serif}
</style>
</head>
<body>
<main>
	<img src="/icons/icon-192.png" alt="">
	<h1>You’re offline</h1>
	<p>PicknPlay is a live game, so it needs a connection. Don’t worry, your game is saved. Open <b>Continue</b> when you’re back online.</p>
	<button type="button" onclick="location.reload()">Try Again</button>
</main>
</body>
</html>
